<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f7fd"/><stop offset="1" stop-color="#f1e8fc"/></linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7d6b"/><stop offset="1" stop-color="#e2513f"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".18"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- étagère & carrelage -->
  <g opacity=".5" stroke="#cfe3ef" stroke-width="2">
    <path d="M0 120h800M0 200h800M0 280h800M100 0v330M220 0v330M340 0v330M460 0v330M580 0v330M700 0v330"/>
  </g>
  <rect x="0" y="330" width="800" height="270" fill="#f6efe6"/>
  <rect x="0" y="330" width="800" height="22" fill="#e6d7c4"/>
  <!-- bocaux -->
  <g filter="url(#sh)">
    <rect x="60" y="210" width="70" height="100" rx="14" fill="#fff" opacity=".9"/><rect x="60" y="250" width="70" height="60" rx="10" fill="#f6c95b"/>
    <rect x="150" y="230" width="60" height="80" rx="12" fill="#fff" opacity=".9"/><rect x="150" y="262" width="60" height="48" rx="10" fill="#e46b4f"/>
    <rect x="640" y="200" width="90" height="110" rx="16" fill="#fff" opacity=".9"/><rect x="640" y="250" width="90" height="60" rx="10" fill="#7cc576"/>
  </g>
  <!-- marmite -->
  <g filter="url(#sh)">
    <ellipse cx="400" cy="470" rx="200" ry="40" fill="#000" opacity=".12"/>
    <rect x="230" y="300" width="340" height="170" rx="40" fill="url(#pot)"/>
    <rect x="200" y="320" width="50" height="22" rx="11" fill="#c8402f"/><rect x="550" y="320" width="50" height="22" rx="11" fill="#c8402f"/>
    <ellipse cx="400" cy="300" rx="175" ry="34" fill="#c8402f"/><ellipse cx="400" cy="300" rx="160" ry="26" fill="#f2a43a"/>
    <circle cx="350" cy="296" r="14" fill="#e66b2f"/><circle cx="420" cy="292" r="12" fill="#5fae3b"/><circle cx="460" cy="302" r="10" fill="#e66b2f"/><circle cx="380" cy="306" r="8" fill="#5fae3b"/>
    <path d="M270 380h260" stroke="#ff9d8f" stroke-width="10" stroke-linecap="round" opacity=".6"/>
  </g>
  <!-- vapeur -->
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".9">
    <path d="M340 250c-20-30 20-50 0-80"><animate attributeName="opacity" values=".9;.3;.9" dur="3s" repeatCount="indefinite"/></path>
    <path d="M400 240c-20-30 20-50 0-90"><animate attributeName="opacity" values=".4;.9;.4" dur="3s" repeatCount="indefinite"/></path>
    <path d="M460 250c-20-30 20-50 0-80"><animate attributeName="opacity" values=".9;.4;.9" dur="3.5s" repeatCount="indefinite"/></path>
  </g>
  <!-- cuillère en bois -->
  <g transform="rotate(-25 560 260)" filter="url(#sh)"><rect x="550" y="120" width="16" height="200" rx="8" fill="#b9814a"/><ellipse cx="558" cy="120" rx="26" ry="38" fill="#c99158"/></g>
  <!-- cœurs -->
  <g fill="#ff6b8b"><path d="M150 140c-6-8-20-4-20 6 0 9 20 22 20 22s20-13 20-22c0-10-14-14-20-6z"/><path d="M660 120c-5-6-16-3-16 5 0 7 16 18 16 18s16-11 16-18c0-8-11-11-16-5z" opacity=".7"/></g>
  <!-- planche à découper -->
  <g filter="url(#sh)"><rect x="560" y="420" width="190" height="110" rx="22" fill="#d9a066"/><circle cx="725" cy="445" r="9" fill="#b9814a"/>
    <circle cx="610" cy="470" r="22" fill="#e53935"/><circle cx="650" cy="480" r="18" fill="#7cc576"/><circle cx="690" cy="495" r="14" fill="#f6c95b"/></g>
  <g filter="url(#sh)"><rect x="60" y="430" width="150" height="90" rx="45" fill="#fff"/><path d="M80 470c20-28 90-28 110 0" fill="#f2c14e"/><circle cx="110" cy="470" r="6" fill="#e66b2f"/><circle cx="150" cy="462" r="6" fill="#5fae3b"/></g>
</svg>
