name: Générer les photos (Nano Banana)

# Lancement manuel : GitHub → Actions → « Générer les photos (Nano Banana) » → Run workflow.
# Prérequis : secret GEMINI_API_KEY (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Régénérer aussi les photos existantes"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Génération
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-images.mjs ${{ inputs.force && '--force' || '' }}
      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/images/dishes packages/shared/src/demo-data.ts
          git diff --cached --quiet || git commit -m "Photos des plats générées (Nano Banana)" && git push
