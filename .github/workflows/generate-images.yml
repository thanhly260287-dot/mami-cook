name: Générer les photos (Nano Banana)

# Lancement manuel : GitHub → Actions → « Générer les photos (Nano Banana) » → Run workflow.
# Prérequis : secret GEMINI_API_KEY (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Quoi générer"
        type: choice
        options: [carrousel, plats]
        default: carrousel
      force:
        description: "Régénérer aussi les photos existantes"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Génération
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.cible }}" = "plats" ]; then
            node scripts/generate-images.mjs ${{ inputs.force && '--force' || '' }}
          else
            node scripts/generate-images.mjs --hero ${{ inputs.force && '--force' || '' }}
            # PNG → JPEG 1600 px (plus léger pour le site)
            sudo apt-get install -y -q imagemagick >/dev/null
            for f in apps/web/public/images/hero/*.png; do [ -e "$f" ] || continue; convert "$f" -resize '1600x1600>' -strip -quality 82 "${f%.png}.jpg" && rm "$f"; done
          fi
      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/images packages/shared/src/demo-data.ts
          git diff --cached --quiet || git commit -m "Images générées par IA (Nano Banana)" && git push
