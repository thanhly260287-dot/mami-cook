name: Déployer Supabase (base de données et fonctions)

# Installe ou met à jour la base de données (migrations) et les fonctions serveur
# du projet Supabase, à chaque modification du dossier supabase/ sur main.
#
# Secrets à créer UNE FOIS dans GitHub (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel Supabase (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   mot de passe de la base choisi à la création du projet
# Facultatifs, transmis aux fonctions serveur s'ils existent :
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PUBLISHABLE_KEY, CRON_SECRET, GEMINI_API_KEY, ANTHROPIC_API_KEY (assistant IA)
on:
  push:
    branches: [main]
    paths: [supabase/**, .github/workflows/deploy-supabase.yml]
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: write

env:
  PROJECT_REF: dxemjkfvaofijqptubfh
  SUPABASE_URL: https://dxemjkfvaofijqptubfh.supabase.co
  # Clé publique (faite pour être visible dans le site et les applis)
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_Y3F7eWHumFQ5IMqcHQSz4A_OmHnHm81
  SITE_URL: ${{ vars.SITE_URL || 'https://mami-cook.vercel.app' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        id: ready
        run: |
          # Indique quel secret est présent, sans jamais afficher sa valeur
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && echo "::notice::SUPABASE_ACCESS_TOKEN : présent" || echo "::warning::SUPABASE_ACCESS_TOKEN : absent"
          [ -n "$SUPABASE_DB_PASSWORD" ] && echo "::notice::SUPABASE_DB_PASSWORD : présent" || echo "::warning::SUPABASE_DB_PASSWORD : absent"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Secrets SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD absents : déploiement ignoré (voir docs/DEPLOIEMENT.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.ok == 'true'
        with: { version: latest }
      - name: Relier le projet
        if: steps.ready.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Base de données (migrations)
        if: steps.ready.outputs.ok == 'true'
        run: supabase db push -p "$SUPABASE_DB_PASSWORD" --include-all
      - name: Secrets des fonctions serveur
        if: steps.ready.outputs.ok == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args="SITE_URL=$SITE_URL ALLOWED_ORIGINS=$SITE_URL"
          for k in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PUBLISHABLE_KEY CRON_SECRET GEMINI_API_KEY ANTHROPIC_API_KEY; do
            [ -n "${!k}" ] && args="$args $k=${!k}"
          done
          supabase secrets set --project-ref "$PROJECT_REF" $args >/dev/null
          echo "Secrets transmis : $(echo "$args" | grep -oE '[A-Z_]+=' | tr -d '=' | tr '\n' ' ')"
      - name: Fonctions serveur
        if: steps.ready.outputs.ok == 'true'
        run: |
          for f in supabase/functions/*/; do
            n=$(basename "$f"); [ "$n" = "_shared" ] && continue
            flags=""; [ "$n" = "stripe-webhook" ] || [ "$n" = "process-payouts" ] || [ "$n" = "send-push" ] || [ "$n" = "assistant" ] && flags="--no-verify-jwt"
            supabase functions deploy "$n" --project-ref "$PROJECT_REF" $flags
          done
      - name: Vérification en ligne
        if: steps.ready.outputs.ok == 'true'
        run: |
          set -e
          countries=$(curl -fsS "$SUPABASE_URL/rest/v1/countries?select=code,enabled&enabled=eq.true" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          feed=$(curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/feed" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{"p_lat":48.8566,"p_lng":2.3522}')
          migrations=$(supabase migration list -p "$SUPABASE_DB_PASSWORD" 2>&1 | tail -15)
          {
            echo "# Déploiement Supabase — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo; echo "Commit : $GITHUB_SHA"
            echo; echo "## Pays ouverts (API publique)"; echo '```'; echo "$countries"; echo '```'
            echo; echo "## Flux d'accueil (API publique)"; echo '```'; echo "$feed" | head -c 500; echo; echo '```'
            echo; echo "## Migrations"; echo '```'; echo "$migrations"; echo '```'
          } > /tmp/status.md
          echo "$countries" | grep -q '"FR"'
          cat /tmp/status.md
      - name: Publier le rapport (branche deploy-status)
        if: always() && steps.ready.outputs.ok == 'true'
        run: |
          [ -f /tmp/status.md ] || echo "# Déploiement en échec — $(date -u) — voir l'onglet Actions" > /tmp/status.md
          echo "Résultat de la tâche : ${{ job.status }}" >> /tmp/status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan deploy-status
          git rm -rq --cached . && cp /tmp/status.md STATUS.md && git add STATUS.md
          git commit -qm "Rapport de déploiement" && git push -qf origin deploy-status
