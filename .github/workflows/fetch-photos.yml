name: Photos des plats (Wikimedia Commons)

# Se lance tout seul quand scripts/photos.json change.
# - Si aucun plat n'a encore de « title » : télécharge des candidates dans la branche photo-review (à trier).
# - Sinon : télécharge les photos choisies et les enregistre sur main.
on:
  push:
    branches: [main]
    paths: [scripts/photos.json, scripts/fetch-photos.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get install -y -q imagemagick >/dev/null
      - name: Candidates ou photos finales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if jq -e '[.dishes[].title] | any(. != "")' scripts/photos.json >/dev/null; then
            python3 scripts/fetch-photos.py final
            git add apps/web/public/images/dishes packages/shared/src/demo-data.ts
            git diff --cached --quiet && exit 0
            git commit -m "Vraies photos des plats (Wikimedia Commons)"
            git push
          else
            python3 scripts/fetch-photos.py candidates
            git checkout -q --orphan photo-review
            git rm -rq --cached .
            git add photo-review
            git commit -qm "Photos candidates à trier"
            git push -f origin photo-review
          fi
